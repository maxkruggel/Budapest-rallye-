<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 400">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef8"/>
      <stop offset=".38" stop-color="#ffedc0"/>
      <stop offset=".72" stop-color="#ffd063"/>
      <stop offset="1" stop-color="#f0a92a"/>
    </linearGradient>
    <radialGradient id="aura" cx=".48" cy=".42" r=".62">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#ffc145" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ffc145" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".45" cy=".38" r=".55">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".6" stop-color="#fff"/>
      <stop offset=".97" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="340" height="400" fill="url(#fade)"/></mask>
    <filter id="ether" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.028" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7">
        <animate attributeName="scale" values="4;10;4" dur="6.2s" repeatCount="indefinite"/>
      </feDisplacementMap>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <ellipse cx="170" cy="190" rx="160" ry="180" fill="url(#aura)" filter="url(#soft)">
    <animate attributeName="opacity" values=".8;1;.8" dur="4.6s" repeatCount="indefinite"/>
  </ellipse>

  <g filter="url(#ether)" mask="url(#m)">
    <g fill="url(#body)">
      <!-- Bowler-Hut -->
      <path d="M118 34c0-16 12-26 28-26s28 10 28 26l2 8H116z"/>
      <rect x="104" y="42" width="84" height="9" rx="4.5"/>
      <!-- Kopf mit Schnurrbart -->
      <ellipse cx="146" cy="70" rx="20" ry="23"/>
      <path d="M132 82c8 6 20 6 28 0l-2 7c-7 4-17 4-24 0z" opacity=".7"/>
      <path d="M138 92h16v12h-16z"/>
      <!-- Sitzender Oberkörper mit Weste -->
      <path d="M146 102c-22 0-36 14-40 36l-6 44c-2 12 4 18 12 18h68c8 0 14-6 12-18l-6-44c-4-22-18-36-40-36z"/>
      <path d="M146 110l-10 16 6 50h8l6-50z" opacity=".5"/>
      <!-- Arme halten die Zeitung -->
      <path d="M110 130c-12 8-20 22-22 36l14 8c4-14 8-30 12-40z"/>
      <path d="M182 130c12 8 20 22 22 36l-14 8c-4-14-8-30-12-40z"/>
      <!-- Aufgeschlagene Zeitung -->
      <path d="M84 172l58 14v52l-58-14z" opacity=".92"/>
      <path d="M208 172l-58 14v52l58-14z" opacity=".92"/>
      <g stroke="#3a2c08" stroke-width="3" opacity=".4" stroke-linecap="round">
        <path d="M94 186l38 9M94 198l38 9M94 210l38 9"/>
        <path d="M198 186l-38 9M198 198l-38 9M198 210l-38 9"/>
      </g>
      <!-- Caféhaus-Tisch mit Espresso -->
      <ellipse cx="252" cy="238" rx="62" ry="12"/>
      <rect x="246" y="244" width="12" height="90" rx="5"/>
      <path d="M226 322c0-8 12-12 26-12s26 4 26 12z"/>
      <!-- Tasse + Dampf -->
      <path d="M238 208h30v14a15 15 0 0 1-30 0z"/>
      <path d="M268 210h8a8 8 0 0 1-2 15l-8 1z"/>
      <!-- Sitzende Beine, unten vergeistert -->
      <path d="M116 200l-4 60c0 30 10 52 24 62 10 6 20 2 20-8l-8-58 10-56z"/>
      <path d="M100 320c12 14 10 28 0 40 14-2 24 0 30 10 8-12 18-14 30-8 6-12 16-16 28-10-8-14-10-26-4-38z" opacity=".6"/>
    </g>

    <!-- Kaffeedampf: lebendig aufsteigend -->
    <g stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".75">
      <path d="M248 186c-4 6 4 8 0 14">
        <animate attributeName="opacity" values=".3;.9;.3" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <path d="M258 184c-4 6 4 8 0 14">
        <animate attributeName="opacity" values=".9;.3;.9" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <path d="M253 176c-3 5 3 6 0 11">
        <animate attributeName="opacity" values=".2;.7;.2" dur="3.6s" begin=".8s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Tiefe: Lesebrille, Augen hinter der Zeitung, Westenknöpfe, Marmormaserung -->
    <g fill="#7a4c00" opacity=".22">
      <path d="M134 62c4-2 8-2 11 0l-1 3c-3-1-6-1-9 0z"/>
      <path d="M150 62c4-2 8-2 11 0l-1 3c-3-1-6-1-9 0z"/>
      <circle cx="139" cy="68" r="4.5" fill="none" stroke="#7a4c00" stroke-width="1.6"/>
      <circle cx="154" cy="68" r="4.5" fill="none" stroke="#7a4c00" stroke-width="1.6"/>
      <path d="M143 68h6v1.5h-6z"/>
      <circle cx="146" cy="130" r="2.4"/><circle cx="145" cy="146" r="2.4"/><circle cx="144" cy="162" r="2.4"/>
      <path d="M204 236c14-2 30-2 44 0l-1 3c-14-2-28-2-42 0z"/>
      <path d="M120 210l-3 50c0 22 6 40 15 50l-4 2c-10-11-16-30-16-52l3-50z"/>
    </g>

    <!-- Licht: Hutglanz, Zeitungskanten, Tassenrand -->
    <g fill="#fff" opacity=".55">
      <path d="M122 32c2-12 12-20 24-20l0 3c-10 0-19 7-21 17z"/>
      <path d="M84 172l58 14-1 3-57-14z"/>
      <path d="M208 172l-58 14 1 3 57-14z"/>
      <path d="M240 208h26v2h-26z"/>
    </g>

    <ellipse cx="150" cy="150" rx="90" ry="110" fill="url(#core)" opacity=".38"/>
  </g>

  <g fill="#ffe9b0">
    <circle cx="70" cy="160" r="2.2"><animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/><animate attributeName="cy" values="170;100" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="180" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="cy" values="190;120" dur="4.5s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="290" r="2"><animate attributeName="opacity" values="0;.9;0" dur="3.9s" begin="2.1s" repeatCount="indefinite"/><animate attributeName="cy" values="300;230" dur="3.9s" begin="2.1s" repeatCount="indefinite"/></circle>
  </g>
</svg>
