name: Deploy zu GitHub Pages

# Deploy-Mechanismus: Pages ist auf "Deploy from branch: gh-pages" konfiguriert.
# Dieser Workflow spiegelt main nach gh-pages; GitHub baut und veroeffentlicht
# die Site dann automatisch (Workflow "pages build and deployment").
# Der direkte Actions-Deploy (actions/deploy-pages) scheitert in diesem Repo
# an den Token-Rechten der Pages-API - der Branch-Weg funktioniert nachweislich.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: main nach gh-pages spiegeln
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:gh-pages --force
